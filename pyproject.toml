[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nabote-lives"
version = "0.1.0"
description = "Análise interna de lives e doações. Só código; dados ficam fora do git."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lives = "lives.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
